openapi: 3.1.0
info:
  title: AINRA registrar console — operator write API
  version: 1
  description: "The operator-facing write API behind the open console (GET /console). Every write requires Authorization: Bearer <operator token> and is rate-limited. This is the confirm-required write path an agent's request flows through with a human approval click. The root has no console and no write API — issuance lives in the registrar."
servers:
  -
    url: "http://127.0.0.1:4907"
    description: local staging registrar (make stage-all)
paths:
  /console:
    get:
      summary: The self-contained operator console (HTML).
      responses:
        200:
          description: OK
  /issue:
    post:
      summary: Issue a credential (bearer token).
      security:
        -
          bearerAuth:
[]
      responses:
        200:
          description: IssuedRecord
        401:
          description: unauthorized
        429:
          description: rate limited
  /renew:
    post:
      summary: Reissue with a fresh window (bearer token).
      security:
        -
          bearerAuth:
[]
      responses:
        200:
          description: IssuedRecord
        401:
          description: unauthorized
  /revoke:
    post:
      summary: Revoke a credential (bearer token).
      security:
        -
          bearerAuth:
[]
      responses:
        200:
          description: StatusDelta
        401:
          description: unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
